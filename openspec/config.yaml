schema: spec-driven

context: |
  Before writing a proposal or design, read docs/domain-model.md, docs/architecture/, and docs/decisions/.
  Follow every accepted decision record.

rules:
  proposal:
    - 'Start with "Source: #<parent issue>"'
  tasks:
    - Group tasks by pull request. Each group is one small pull request covering one layer.

operations:
  apply:
    guidance:
      - Build one group per apply run, then stop and open one pull request.
